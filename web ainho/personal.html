<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obra personal — Ainhoa Agüera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="index.html">Ainhoa Agüera</a>
  <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
    <span></span><span></span>
  </button>
  <nav class="site-nav" id="siteNav">
    <a href="index.html" aria-current="page">Trabajo</a>
    <a href="about.html">Sobre mí</a>
    <a href="contact.html">Contacto</a>
  </nav>
</header>

<main>
  <p class="crumb"><a href="index.html">Trabajo</a> — Obra personal</p>

  <section class="work">
    <div class="tile-grid">

      <figure class="tile is-empty">
        <button class="thumb" data-full="assets/personal/01.jpg" aria-label="Ampliar imagen — Obra personal, sin título">
          <img src="assets/personal/01.jpg" alt="Obra personal, sin título" loading="lazy" onerror="this.closest('.tile').classList.add('is-empty')">
        </button>
        <figcaption class="tile-caption">
          <span class="cap-a">Obra personal</span>
          <span class="cap-b">Sin título</span>
        </figcaption>
      </figure>

      <figure class="tile is-empty">
        <button class="thumb" data-full="assets/personal/02.jpg" aria-label="Ampliar imagen — Obra personal, sin título">
          <img src="assets/personal/02.jpg" alt="Obra personal, sin título" loading="lazy" onerror="this.closest('.tile').classList.add('is-empty')">
        </button>
        <figcaption class="tile-caption">
          <span class="cap-a">Obra personal</span>
          <span class="cap-b">Sin título</span>
        </figcaption>
      </figure>

    </div>
  </section>
</main>

<footer class="site-footer">
  <a href="index.html">Volver a trabajo</a>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">×</button>
  <button class="lightbox-prev" id="lightboxPrev" aria-label="Imagen anterior">‹</button>
  <img id="lightboxImage" src="" alt="">
  <button class="lightbox-next" id="lightboxNext" aria-label="Imagen siguiente">›</button>
  <figcaption class="lightbox-caption" id="lightboxCaption" hidden></figcaption>
</div>

<script src="script.js"></script>
</body>
</html>
