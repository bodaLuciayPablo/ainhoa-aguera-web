<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Designer — Ainhoa Agüera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="index.html">Ainhoa Agüera</a>
  <button class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false">
    <span></span><span></span>
  </button>
  <nav class="site-nav" id="siteNav">
    <a href="index.html" aria-current="page">Trabajo</a>
    <a href="about.html">Sobre mí</a>
    <a href="contact.html">Contacto</a>
  </nav>
</header>

<main>
  <p class="crumb"><a href="index.html">Trabajo</a> — Set Designer</p>

  <!-- Cada foto muestra sus créditos al pasar el cursor (o al tocar, en móvil).
       Las fotos de asistencia llevan la clase "tile tile--asistencia": eso
       añade el pequeño ✱ fijo en la esquina, además de la etiqueta habitual. -->
  <section class="work">
    <div class="tile-grid">

      <figure class="tile tile--asistencia">
        <button class="thumb" data-full="set_1.jpg, set_1.1.jpg" aria-label="Ampliar imagen">
          <img src="set_1.jpg" alt="Asistencia">
        </button>
        <figcaption class="tile-caption"><span class="cap-a">Asistencia a Dagmar</span><span class="cap-b">Set Designer</span></figcaption>
      </figure>

      <figure class="tile">
        <button class="thumb" data-full="set_2.jpg, set_2.2.jpg, set_2.3.jpg, set_2.4.jpg" aria-label="Ampliar imagen">
          <img src="set_2.jpg" alt="">
        </button>
        <figcaption class="tile-caption"><span class="cap-a">@colmadosanisidro</span><span class="cap-b"></span></figcaption>
      </figure>

      <!-- PENDIENTE: videoclip "Lorna 2.0" — falta el enlace del vídeo. Sin créditos: el arte es de Elena.
      <figure class="tile">
        <div class="video-embed">
          <iframe
            src=""
            title="Lorna 2.0"
            allow="autoplay; encrypted-media"
            loading="lazy">
          </iframe>
        </div>
        <figcaption class="tile-caption"><span class="cap-a"></span><span class="cap-b"></span></figcaption>
      </figure>
      -->

      <figure class="tile tile--asistencia">
        <button class="thumb" data-full="set_3.jpg, set_3.1.jpg" aria-label="Ampliar imagen">
          <img src="set_3.jpg" alt="Asistencia">
        </button>
        <figcaption class="tile-caption"><span class="cap-a">Asistencia a Pablo Chamorro</span><span class="cap-b">@oficialedel</span></figcaption>
      </figure>

      <figure class="tile">
        <button class="thumb" data-full="set_4.jpeg, set_4.1.jpeg" aria-label="Ampliar imagen">
          <img src="set_4.jpeg" alt="">
        </button>
        <figcaption class="tile-caption"><span class="cap-a">@fuuuckingyoung</span><span class="cap-b"></span></figcaption>
      </figure>

      <figure class="tile">
        <button class="thumb" data-full="set_5.jpg" aria-label="Ampliar imagen">
          <img src="set_5.jpg" alt="">
        </button>
        <figcaption class="tile-caption"><span class="cap-a">@nii.hai</span><span class="cap-b"></span></figcaption>
      </figure>

    </div>
  </section>
</main>

<footer class="site-footer">
  <a href="index.html">Volver a trabajo</a>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">×</button>
  <button class="lightbox-prev" id="lightboxPrev" aria-label="Imagen anterior">‹</button>
  <img id="lightboxImage" src="" alt="">
  <button class="lightbox-next" id="lightboxNext" aria-label="Imagen siguiente">›</button>
  <figcaption class="lightbox-caption" id="lightboxCaption" hidden></figcaption>
</div>

<script src="script.js"></script>
</body>
</html>
